<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 6B-1: Going Green!</title>
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-dark: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-dark: #1899d6;
            --duo-text: #4b4b4b;
            --duo-gray: #e5e5e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'din-round', sans-serif, Arial;
            background-color: #ffffff;
            color: var(--duo-text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }

        .header {
            padding: 40px 0;
            border-bottom: 2px solid var(--duo-gray);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: var(--duo-blue);
        }

        .card-stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .revision-card {
            background: white;
            border: 2px solid var(--duo-gray);
            border-bottom: 5px solid var(--duo-gray);
            border-radius: 20px;
            padding: 30px;
            text-align: left;
            transition: transform 0.2s, border-color 0.2s;
            cursor: default;
        }

        .revision-card:hover {
            border-color: var(--duo-blue);
            transform: scale(1.02);
        }

        .word-label {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            color: #afafaf;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .key-term {
            font-size: 24px;
            font-weight: 800;
            color: var(--duo-green-dark);
            margin-bottom: 15px;
            display: block;
        }

        .sentence-box {
            font-size: 19px;
            line-height: 1.6;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
            color: var(--duo-text);
        }

        .sentence-box b {
            color: var(--duo-blue);
            background: #e1f5fe;
            padding: 2px 6px;
            border-radius: 5px;
        }

        /* Fixed Navigation Footer */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 2px solid var(--duo-gray);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }

        .nav-btn {
            background: var(--duo-blue);
            color: white;
            border: none;
            border-bottom: 4px solid var(--duo-blue-dark);
            padding: 12px 30px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .nav-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .nav-btn.secondary {
            background: #fff;
            color: var(--duo-blue);
            border: 2px solid var(--duo-gray);
            border-bottom: 4px solid var(--duo-gray);
        }

        .loading-spinner {
            font-size: 20px;
            color: #afafaf;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Unit 6 Revision</h1>
        <p style="color:#afafaf; margin-top:5px;">Study words and sentences</p>
    </div>

    <div id="loading" class="loading-spinner">Loading Revision Cards...</div>
    
    <div class="card-stack" id="revision-stack">
        <!-- Cards will appear here -->
    </div>
</div>

<div class="footer-nav">
    <button class="nav-btn secondary" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">Top</button>
    <button class="nav-btn" onclick="location.reload()">Refresh Data</button>
</div>

<script>
    // GitHub JSON URL
    const DATA_URL = 'https://raw.githubusercontent.com/nattoisemobileai-max/EN-P6/main/quizData-6B-1.json';

    async function loadRevisionMode() {
        try {
            const response = await fetch(DATA_URL);
            const data = await response.json();
            
            const stack = document.getElementById('revision-stack');
            document.getElementById('loading').style.display = 'none';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'revision-card';

                // Extract the core word from the explanation or option
                const correctWord = item.options[item.correct];
                
                // Highlight the key word in the explanation sentence
                let formattedSentence = item.explanation.replace(
                    new RegExp(correctWord, 'gi'), 
                    `<b>${correctWord}</b>`
                );

                card.innerHTML = `
                    <div class="word-label">Key Word</div>
                    <span class="key-term">${correctWord}</span>
                    <div class="word-label" style="margin-top:20px;">In a Sentence</div>
                    <div class="sentence-box">${formattedSentence}</div>
                `;
                stack.appendChild(card);
            });
        } catch (error) {
            document.getElementById('loading').textContent = "Failed to load cards. Please check your internet.";
            console.error(error);
        }
    }

    loadRevisionMode();
</script>

</body>
</html>
