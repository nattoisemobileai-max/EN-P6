<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6B : Going Green</title>
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-blue: #1cb0f6;
            --duo-text: #4b4b4b;
            --duo-gray: #e5e5e5;
        }

        body {
            font-family: 'din-round', sans-serif, Arial;
            background: #f7f7f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { margin-bottom: 20px; text-align: center; }

        /* Card container now ensures it doesn't overlap buttons */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 450px; /* Increased height for better clearance */
            margin-bottom: 40px; /* Stronger gap between card and buttons */
            position: relative;
            z-index: 1; /* Lower than buttons */
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            border: 2px solid var(--duo-gray);
            border-bottom: 6px solid var(--duo-gray);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card-back { transform: rotateY(180deg); }

        .card-back img {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        /* Navigation Buttons - Higher z-index to stay on top */
        .nav-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            position: relative;
            z-index: 10; 
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn-prev { background: #fff; border: 2px solid var(--duo-gray); border-bottom: 4px solid var(--duo-gray); color: #afafaf; }
        .btn-next { background: var(--duo-blue); border-bottom: 4px solid #1899d6; color: white; }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .counter { 
            color: #afafaf; 
            font-weight: bold; 
            font-size: 18px; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Unit 6B : Going Green</h1>
        <p style="color:#afafaf;">Tap to flip, then use buttons below</p>
    </header>

    <div class="card-container" onclick="flipCard()">
        <div class="card-inner" id="card-inner">
            <div class="card-face card-front">
                <h2 id="front-text" style="font-size: 32px; color: var(--duo-green);">Loading...</h2>
            </div>
            <div class="card-face card-back">
                <img id="back-image" src="" alt="Revision Image">
                <p id="back-sentence" style="font-size: 18px; text-align: center;"></p>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <button class="btn btn-prev" onclick="changeCard(-1)">Previous</button>
        <button class="btn btn-next" onclick="changeCard(1)">Next</button>
    </div>
    <div class="counter" id="counter">1 / 6</div>
</div>
    
<!-- Add this button inside the 'nav-footer' div in your HTML -->
<div class="nav-footer">
    <button class="btn btn-prev" onclick="changeCard(-1)">Previous</button>
    
    <!-- New Quiz Link Button -->
    <a href="unit6-quiz.html" style="text-decoration: none; flex: 1;">
        <button class="btn" style="background: #ffc800; border-bottom: 4px solid #e5a500; color: white; width: 100%;">
            Unit Quiz
        </button>
    </a>

    <button class="btn btn-next" onclick="changeCard(1)">Next</button>
</div>

<script>
    const DATA_URL = 'https://raw.githubusercontent.com/nattoisemobileai-max/EN-P6/main/words_6B-1.json';
    let revisionData = [];
    let currentIdx = 0;

    async function init() {
        try {
            const response = await fetch(DATA_URL);
            revisionData = await response.json();
            updateUI();
        } catch (e) { document.getElementById('front-text').textContent = "Data Error"; }
    }

    function updateUI() {
        const item = revisionData[currentIdx];
        const inner = document.getElementById('card-inner');
        inner.classList.remove('flipped');

        setTimeout(() => {
            document.getElementById('front-text').textContent = item.term;
            document.getElementById('back-sentence').textContent = item.sentence;
            const imgPath = `images/${item.image_id.replace(':', '-')}.jpg`;
            document.getElementById('back-image').src = imgPath;
            document.getElementById('counter').textContent = `${currentIdx + 1} / ${revisionData.length}`;
        }, 150);
    }

    function flipCard() { document.getElementById('card-inner').classList.toggle('flipped'); }

    function changeCard(dir) {
        currentIdx = (currentIdx + dir + revisionData.length) % revisionData.length;
        updateUI();
    }

    init();
</script>
</body>
</html>
