<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6B : Going Green</title>
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-blue: #1cb0f6;
            --duo-text: #4b4b4b;
            --duo-gray: #e5e5e5;
        }

        body {
            font-family: 'din-round', sans-serif, Arial;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container { width: 100%; max-width: 500px; text-align: center; }

        header { margin-bottom: 30px; }
        h1 { color: var(--duo-text); font-size: 24px; }

        /* Flip Card Logic */
        .card-container {
            perspective: 1000px;
            margin-bottom: 30px;
            height: 400px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            border: 2px solid var(--duo-gray);
            border-bottom: 6px solid var(--duo-gray);
            border-radius: 24px;
            padding: 30px;
        }

        /* Front Face (Word) */
        .card-front {
            z-index: 2;
        }

        .card-front h2 {
            font-size: 32px;
            color: var(--duo-green);
        }

        /* Back Face (Image + Sentence) */
        .card-back {
            transform: rotateY(180deg);
            background: #fff;
        }

        .card-back img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .card-back p {
            font-size: 18px;
            line-height: 1.4;
            color: var(--duo-text);
        }

        /* Navigation */
        .nav-footer {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 16px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn-prev { background: #fff; border: 2px solid var(--duo-gray); border-bottom: 4px solid var(--duo-gray); color: #afafaf; }
        .btn-next { background: var(--duo-blue); border-bottom: 4px solid #1899d6; color: white; }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .counter { margin-top: 20px; color: #afafaf; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Unit 6B Revision</h1>
        <p style="color:#afafaf;">Tap the card to flip!</p>
    </header>

    <div class="card-container" onclick="flipCard()">
        <div class="card-inner" id="card-inner">
            <div class="card-face card-front">
                <div style="font-size:12px; text-transform:uppercase; color:#afafaf; margin-bottom:10px;">Word / Phrase</div>
                <h2 id="front-text">Loading...</h2>
            </div>
            <div class="card-face card-back">
                <img id="back-image" src="" alt="Revision Image" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image+Found'">
                <p id="back-sentence"></p>
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <button class="btn btn-prev" onclick="changeCard(-1)">Previous</button>
        <button class="btn btn-next" onclick="changeCard(1)">Next</button>
    </div>
    <div class="counter" id="counter">0 / 0</div>
</div>

<script>
    // 1. Link your JSON here
    const DATA_URL = 'https://raw.githubusercontent.com/nattoisemobileai-max/EN-P6/main/words_6B-1.json';
    
    let revisionData = [];
    let currentIdx = 0;

    async function init() {
        try {
            const response = await fetch(DATA_URL);
            revisionData = await response.json();
            updateUI();
        } catch (e) {
            document.getElementById('front-text').textContent = "Error loading data.";
        }
    }

    function updateUI() {
        const item = revisionData[currentIdx];
        const inner = document.getElementById('card-inner');
        
        // Reset flip state when changing cards
        inner.classList.remove('flipped');

        setTimeout(() => {
            document.getElementById('front-text').textContent = item.term;
            document.getElementById('back-sentence').textContent = item.sentence;
            
            // 2. IMAGE LINKING LOGIC:
            // This assumes your images are named exactly like the image_id + .jpg
            // Example: "file:13" becomes "images/file-13.jpg"
            const imgPath = `images/${item.image_id.replace(':', '-')}.jpg`;
            document.getElementById('back-image').src = imgPath;
            
            document.getElementById('counter').textContent = `${currentIdx + 1} / ${revisionData.length}`;
        }, 150);
    }

    function flipCard() {
        document.getElementById('card-inner').classList.toggle('flipped');
    }

    function changeCard(dir) {
        currentIdx += dir;
        if (currentIdx < 0) currentIdx = revisionData.length - 1;
        if (currentIdx >= revisionData.length) currentIdx = 0;
        updateUI();
    }

    init();
</script>
</body>
</html>
